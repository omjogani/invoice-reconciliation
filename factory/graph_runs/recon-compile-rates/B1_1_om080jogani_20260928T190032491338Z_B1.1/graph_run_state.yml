      validation_feedback: null
      summary: "Read the Alpine Express contract adversarially, mapped all 7 clauses\
        \ to rate-card fields (freight bands with an explicit gap at exactly 50 kg\
        \ since the contract says 'under'/'over' without covering the boundary, the\
        \ 25 kg chargeable-weight floor, standard-only service levels, the \u20B9\
        150 fragile accessorial, the >12-consignment 5% volume discount, and payment/notice\
        \ clauses as non_pricing), left credit_notes/unmatched_lines/dispute_window\
        \ null since the contract is silent on them, and wrote card-b.json which passes\
        \ check-card."
      notes: "Deliberately left a pricing gap at chargeable weight == 50 kg: \xA7\
        2 says\n\"under 50 kg\" gets \u20B99.50/kg and \"over 50 kg\" gets \u20B9\
        8.25/kg, so 50 kg\nexactly is covered by neither band (min_inclusive=false\
        \ on the upper\nband, max_inclusive=false on the lower band). This matches\
        \ the approved\n\"50 kg null+escalate\" design decision rather than widening\
        \ either band.\ncredit_notes, unmatched_lines, and dispute_window are all\
        \ null \u2014 the\ncontract has no clauses addressing credit notes, unmatched\
        \ invoice\nlines, or a dispute deadline.\n"
      usage: null
      harness: claude-code
